name: Feature request
description: Suggest a capability, protocol, workflow, or UX improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should AetherCast do? Include sketches or examples if helpful.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Discovery
        - Connection and pairing
        - Video
        - Audio
        - UI and UX
        - CLI and headless mode
        - Packaging
        - Documentation
        - Protocol support
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have tried.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the research notes.
          required: true
        - label: This request respects the project's no-DRM-circumvention policy.
          required: true
