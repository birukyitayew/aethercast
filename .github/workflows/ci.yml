name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # libpulse aborts on default server discovery on some systems, so the
  # PipeWire-Pulse socket is always named explicitly.
  PULSE_SERVER: unix:/run/user/1000/pulse/native

jobs:
  build-and-test:
    name: build, test, and cast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install the GStreamer development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly ffmpeg

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --all

      - name: Lint
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo fmt --all -- --check

      - name: The end-to-end cast
        run: |
          # A generated test pattern instead of the screen, and no audio:
          # a build server has neither a display nor a sound card.
          TEST_PATTERN=1 NO_AUDIO=1 ./spike/19-end-to-end.sh 10

      - name: The media conformance checks
        run: |
          NO_AUDIO=1 ./spike/04-media-conformance.sh
