[package]
name = "aethercastd"
description = "AetherCast session daemon: Miracast (Wi-Fi Display) source for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aethercastd"
path = "src/main.rs"

[dependencies]
aethercast-api = { path = "../aethercast-api", features = ["cli"] }
anyhow.workspace = true
clap.workspace = true
futures-util = "0.3.34"
gstreamer = "0.24"
if-addrs = "0.15.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
zbus = "4.4.0"
