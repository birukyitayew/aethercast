[package]
name = "aethercast-client"
description = "AetherCast: the graphical client for the AetherCast session daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aethercast"
path = "src/main.rs"

[dependencies]
aethercast-api = { path = "../aethercast-api" }
anyhow.workspace = true
futures-util = "0.3.34"
glib = "0.20"
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_4"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
zbus = "4.4.0"
